name: Deploy to Staging

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6

      - name: Build staging container image
        run: docker build --tag univio-staging:${{ github.sha }} .

      - name: Deploy staging container
        run: echo "Replace this with the staging registry push and deployment command."
