name: Secret History Scan

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog-history:
    name: TruffleHog full history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan complete Git history for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
