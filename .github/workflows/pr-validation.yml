name: PR Validation

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  python-quality:
    name: Python tests and quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Lint Python code
        run: ruff check .

      - name: Run tests
        run: pytest -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build container image
        run: docker build --tag univio:${{ github.sha }} .

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Scan Python code
        run: semgrep scan --config p/python --config p/security-audit --error

  trufflehog:
    name: TruffleHog secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan changed commits for exposed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  trivy:
    name: Trivy dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan dependencies for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  ai-review:
    name: Gemini code review
    runs-on: ubuntu-latest
    # GitHub does not provide repository secrets to workflows from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Review pull request with Gemini
        uses: cirolini/genai-code-review@v3
        with:
          provider: gemini
          model: gemini-3.8-flash
          api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_pr_id: ${{ github.event.number }}
          max_comments: 5
          custom_prompt: >-
            Review this pull request as a peer-level engineer. Provide only
            constructive, actionable findings. Prioritize logic bugs, exposed
            credentials or secrets, unsafe input handling, and overly broad
            exception handling such as bare except blocks. Do not approve the PR.
