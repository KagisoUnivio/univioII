name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Build production container image
        run: docker build --tag univio-production:${{ github.sha }} .

      - name: Deploy production container
        run: echo "Replace this with the production registry push and deployment command."
